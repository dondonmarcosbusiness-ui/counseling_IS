name: macOS Test Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build macOS test installer
        run: bash scripts/build_macos_installer.sh

      - name: Publish temporary DMG
        uses: actions/upload-artifact@v4
        with:
          name: CounselingIS-macOS-test
          path: build/dmg/*.dmg
          if-no-files-found: error
          retention-days: 3
