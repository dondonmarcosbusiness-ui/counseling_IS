name: Windows Installer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    name: Build EXE
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build installer
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\build_windows_installer.ps1

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Counseling-IS-Windows-installer
          path: build/windows/installer/*.exe
          if-no-files-found: error
          retention-days: 30
